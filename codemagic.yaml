workflows:
  android-debug:
    name: Android - APK debug
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Prepare www/ from the web game source
        script: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r icons www/
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-unsigned-simulator:
    name: iOS - build check (simulator, unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Prepare www/ from the web game source
        script: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r icons www/
      - name: Sync Capacitor (iOS)
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Build for iOS Simulator (no code signing required)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  # Real-device / App Store build. Disabled until an Apple Developer Program
  # account (paid, developer.apple.com/programs) is connected in Codemagic
  # for automatic code signing. Without it, Apple does not allow producing
  # an .ipa that installs on a physical iPhone.
  # ios-release:
  #   name: iOS - signed IPA (needs Apple Developer account)
  #   instance_type: mac_mini_m2
  #   integrations:
  #     app_store_connect: <to configure once the account exists>
  #   ...
