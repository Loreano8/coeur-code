<style>
  :root{
    --bg:#F7F4FB;
    --surface:#FFFFFF;
    --ink:#2B2630;
    --ink-soft:#6B6475;
    --p1:#E8546B;
    --p1-soft:#FBE1E6;
    --p2:#1F6F78;
    --p2-soft:#DCEEEF;
    --gold:#E8A23D;
    --line:#E4DEEE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px 60px;}
  .app{width:100%;max-width:520px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .brand{text-align:center;margin-bottom:20px;}
  .brand h1{font-size:2.1rem;font-weight:700;letter-spacing:-0.01em;}
  .brand .signal{width:100%;height:18px;display:flex;align-items:center;justify-content:center;margin:10px 0 6px;}
  .signal .dash{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ink-soft) 0 6px, transparent 6px 12px);opacity:.55;}
  .signal .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin:0 10px;box-shadow:0 0 0 5px rgba(232,162,61,.18);}
  .brand p{color:var(--ink-soft);font-size:.92rem;margin-top:2px;}

  .toggle-row{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .toggle-row button{padding:6px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .toggle-row button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .field-label{text-align:center;font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .profile-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:.95rem;font-weight:600;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 1px 2px rgba(43,38,48,.04);margin-bottom:16px;}
  label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:1rem;font-family:'Inter',sans-serif;color:var(--ink);background:#fff;outline:none;margin-bottom:16px;}
  input[type=text]:focus{border-color:var(--p2);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 18px;border-radius:10px;border:none;font-family:'Inter',sans-serif;font-weight:600;font-size:.98rem;cursor:pointer;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-row{display:flex;gap:10px;margin-top:4px;}
  .btn-row .btn{margin:0;}
  .btn-link{background:none;border:none;color:var(--ink-soft);font-size:.8rem;text-decoration:underline;cursor:pointer;padding:6px;width:100%;}
  .btn-sm{padding:9px 14px;font-size:.85rem;width:auto;}

  .error{color:var(--p1);font-size:.85rem;margin:-8px 0 14px;}
  .hint{color:var(--ink-soft);font-size:.82rem;margin-top:-8px;}

  .code-display{text-align:center;padding:18px 0 6px;}
  .code-display .code{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:700;letter-spacing:.18em;color:var(--p2);}
  .waiting-pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p2);animation:pulse 1.2s infinite ease-in-out;margin-right:6px;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  .players-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .player-chip{flex:1;background:var(--p1-soft);border-radius:12px;padding:10px 14px;text-align:center;}
  .player-chip.p2{background:var(--p2-soft);}
  .player-chip .name{font-weight:700;font-size:.92rem;}
  .player-chip.p1 .name{color:var(--p1);}
  .player-chip.p2 .name{color:var(--p2);}
  .player-chip .role-label{font-size:.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .link-mid{flex:0 0 auto;font-size:.75rem;color:var(--ink-soft);}

  .score-row .score-name{display:block;font-size:.68rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

  .score-row .score-sep{color:var(--line);font-size:1.2rem;}

  .word-row.mine .slot{border-color:var(--p1);}
  .word-row.theirs .slot{border-color:var(--p2);}
  .section-label{font-size:.78rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-top:18px;margin-bottom:2px;}

  .turn-banner{text-align:center;padding:9px 12px;border-radius:10px;font-weight:600;font-size:.92rem;margin-bottom:10px;}
  .turn-banner.mine{background:var(--p1-soft);color:var(--p1);}
  .turn-banner.theirs{background:var(--p2-soft);color:var(--p2);}
  .turn-banner.pause{background:#FFF3DC;color:#8A6416;}

  .timer-wrap{margin-bottom:10px;}
  .timer-bar-outer{width:100%;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .timer-bar-inner{height:100%;background:var(--gold);}
  .timer-text{text-align:center;font-size:.74rem;color:var(--ink-soft);margin-top:5px;}

  .pause-box{background:#FFF9EE;border:1px solid #F0DCA8;border-radius:12px;padding:14px;text-align:center;margin-bottom:16px;}
  .pause-box p{margin:0 0 10px;font-size:.88rem;color:#8A6416;font-weight:600;}
  .pause-box .btn-row{gap:8px;}
  .pause-link-row{text-align:center;margin-bottom:14px;}

  .keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;}
  .key{padding:10px 0;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-family:'Inter',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink);}
  .key:disabled{cursor:not-allowed;}
  .key.hit{background:var(--p2);border-color:var(--p2);color:#fff;}
  .key.miss{background:#F1EEF6;border-color:var(--line);color:var(--ink-soft);text-decoration:line-through;}
  .key:not(:disabled):active{transform:scale(.94);}

  .winner-screen{text-align:center;padding:20px 0 4px;}
  .winner-screen .trophy{font-size:2.6rem;display:inline-block;animation:trophyBounce 1.1s ease-in-out infinite;}
  @keyframes trophyBounce{0%,100%{transform:translateY(0) rotate(0deg);}30%{transform:translateY(-10px) rotate(-8deg);}60%{transform:translateY(0) rotate(8deg);}}
  .winner-screen h2{font-size:1.6rem;margin-top:6px;}
  .reveal-words{display:flex;gap:12px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap;}
  .reveal-words div{background:var(--bg);border-radius:10px;padding:10px 16px;font-family:'Fraunces',serif;font-size:1rem;}

  .history-list{margin-top:8px;text-align:left;max-height:180px;overflow-y:auto;}
  .history-item{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:7px 2px;border-bottom:1px dashed var(--line);}
  .history-item:last-child{border-bottom:none;}
  .history-round{color:var(--ink-soft);}
  .history-winner{font-weight:600;}

  .footer-note{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:18px;line-height:1.5;}

  .confetti-piece{position:fixed;top:-24px;width:8px;height:14px;opacity:.95;pointer-events:none;z-index:9999;border-radius:2px;}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(420deg);opacity:.25;}}

  .music-toggle{position:fixed;top:14px;right:14px;width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;box-shadow:0 1px 4px rgba(43,38,48,.1);z-index:200;}
  .music-toggle:active{transform:scale(.92);}
</style>

let currentLang = 'fr';
function tr(key, vars){
  const dict = T[currentLang] || T.fr;
  let s = dict[key] || key;
  if(vars){ for(const k in vars){ s = s.split('{'+k+'}').join(vars[k]); } }

}

/* ---------- State ---------- */
let myRole = null;
let roomCode = null;
let myName = '';
let selectedLang = 'fr';
let selectedTurnSeconds = 30;
let pollTimer = null;

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

const AI_WORDS_FR = ['maison','jardin','soleil','nuage','musique','voyage','cuisine','lecture','fenetre','montagne','riviere','plage','foret','oiseau','poisson','fromage','gateau','chocolat','orange','citron','fraise','tomate','carotte','patate','oignon','poivron','salade','boulanger','medecin','avocat','peintre','musicien','danseur','chanteur','acteur','sportif','etudiant','voiture','bicyclette','avion','bateau','train','autobus','valise','passeport','aeroport','hotel','restaurant','cinema','theatre','bibliotheque','ecole','universite','hopital','pharmacie','banque','marche','magasin','cadeau','anniversaire','mariage','famille','amitie','amour','bonheur','tristesse','colere','surprise','courage','patience','sagesse','liberte','justice','verite','mensonge','secret','mystere','aventure','histoire','roman','poeme','chanson','danse','football','basketball','tennis','natation','cyclisme','randonnee','camping','peche','chasse','jardinage','bricolage','couture','dessin','peinture','sculpture','informatique','telephone','ordinateur','internet','television','journal','magazine','livre','cahier','crayon','ciseaux','papier','carton','plastique','metal','pierre','sable','etoile','planete','univers','galaxie'];
const AI_WORDS_EN = ['house','garden','sunset','cloud','music','travel','kitchen','reading','window','mountain','river','beach','forest','bird','fish','cheese','cake','chocolate','orange','lemon','strawberry','tomato','carrot','potato','onion','pepper','salad','bakery','doctor','lawyer','painter','musician','dancer','singer','actor','athlete','student','bicycle','airplane','boat','train','suitcase','passport','airport','hotel','restaurant','cinema','theater','library','school','university','hospital','pharmacy','market','store','gift','birthday','wedding','family','friendship','love','happiness','sadness','anger','surprise','courage','patience','wisdom','freedom','justice','truth','secret','mystery','adventure','story','novel','poem','song','dance','football','basketball','tennis','swimming','cycling','hiking','camping','fishing','hunting','gardening','sewing','drawing','painting','sculpture','computer','phone','internet','television','newspaper','magazine','notebook','pencil','scissors','paper','cardboard','plastic','metal','stone','sand','star','planet','universe','galaxy'];
const FR_FREQ_ORDER = ['E','A','I','S','N','T','R','U','L','O','D','C','P','M','V','G','F','B','H','Q','X','J','Y','Z','K','W'];
const EN_FREQ_ORDER = ['E','T','A','O','I','N','S','H','R','D','L','U','C','M','F','Y','W','G','P','B','V','K','X','Q','J','Z'];

function pickAIWord(lang){
  const list = lang === 'fr' ? AI_WORDS_FR : AI_WORDS_EN;
  return normWord(list[Math.floor(Math.random() * list.length)]);
}

function aiChooseLetter(opts){
  const { difficulty, lang, wordLength, revealed, guessedLetters, missedLetters } = opts;
  const remaining = ALPHABET.filter(l => !guessedLetters.includes(l));
  if(remaining.length === 0) return null;

  if(difficulty === 'easy'){
    return remaining[Math.floor(Math.random() * remaining.length)];
  }

  if(difficulty === 'hard'){
    const list = lang === 'fr' ? AI_WORDS_FR : AI_WORDS_EN;
    const candidates = list.map(w => normWord(w)).filter(w => {
      if(w.length !== wordLength) return false;
      for(let i = 0; i < wordLength; i++){
        if(revealed[i] !== '_' && w[i] !== revealed[i]) return false;
      }
      for(const m of missedLetters){ if(w.includes(m)) return false; }
      return true;
    });
    if(candidates.length > 0){
      const freq = {};
      candidates.forEach(w => {
        new Set(w.split('')).forEach(ch => { freq[ch] = (freq[ch] || 0) + 1; });
      });
      let best = null, bestScore = -1;
      remaining.forEach(l => {
        const score = freq[l] || 0;
        if(score > bestScore){ bestScore = score; best = l; }
      });
      if(best && bestScore > 0) return best;
    }
  }

  const order = lang === 'fr' ? FR_FREQ_ORDER : EN_FREQ_ORDER;
  for(const l of order){ if(remaining.includes(l)) return l; }
  return remaining[0];
}

function getSavedName(){
  try{ return localStorage.getItem('cc_playerName') || ''; }catch(e){ return ''; }
}
function setSavedName(name){
  try{ localStorage.setItem('cc_playerName', name); }catch(e){ /* storage unavailable — just skip */ }
}
function saveSession(){
  try{ localStorage.setItem('cc_session', JSON.stringify({ roomCode, myRole })); }catch(e){}
}
function getSavedSession(){
  try{
    const raw = localStorage.getItem('cc_session');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSavedSession(){
  try{ localStorage.removeItem('cc_session'); }catch(e){}
}

function normWord(w){
  return w.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'');
}
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function emptyRoom(code, p1name, lang, turnSeconds){
  return {
    code, createdAt: Date.now(), lang, turnSeconds,
    players: { p1: { name: p1name, word: null, guesses: [] }, p2: null },
    turn: 'p1',
    turnStartedAt: null,
    status: 'waiting',
    winner: null,
    scores: { p1: 0, p2: 0 },
    round: 1,
    pause: { status: 'none', requestedBy: null, frozenAt: null },
    history: []
  };
}

/* ---------- Storage (MantleDB — public, no-account JSON store) ---------- */
const MANTLE_NS = 'coeur-code-bj2026';
async function loadRoom(code){
  try{
    const res = await fetch(`https://mantledb.sh/v2/${MANTLE_NS}/${code}`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function saveRoom(room){
  try{
    await fetch(`https://mantledb.sh/v2/${MANTLE_NS}/${room.code}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(room)
    });
  }catch(e){ console.error('Erreur de sauvegarde', e); }
  return room;
}
async function loadRaw(key){
  try{
    const res = await fetch(`https://mantledb.sh/v2/${MANTLE_NS}/${key}`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function saveRaw(key, data){
  try{
    await fetch(`https://mantledb.sh/v2/${MANTLE_NS}/${key}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
    });
  }catch(e){ /* best effort */ }
  return data;
}

function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function startPolling(fn){ stopPolling(); pollTimer = setInterval(fn, 2200); }
function stopTick(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }

function fingerprint(room){
  return JSON.stringify({
    status: room.status, turn: room.turn, turnStartedAt: room.turnStartedAt,
    p1g: room.players.p1 && room.players.p1.guesses, p2g: room.players.p2 && room.players.p2.guesses,
    p1w: !!(room.players.p1 && room.players.p1.word), p2w: !!(room.players.p2 && room.players.p2.word),
    pause: room.pause, scores: room.scores, round: room.round, winner: room.winner
  });
}

/* ---------- Confetti ---------- */
function spawnConfetti(){
  const colors = ['#E8546B','#1F6F78','#E8A23D','#B784E0','#5AA8D6'];
  for(let i=0;i<60;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random()*100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animation = `confettiFall ${2.4 + Math.random()*1.4}s linear forwards`;
    piece.style.animationDelay = (Math.random()*0.5) + 's';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 4200);
  }
}

async function checkForResumableSession(){
  const session = getSavedSession();
  if(!session || !session.roomCode || !session.myRole) return;
  const room = await loadRoom(session.roomCode);
  const slot = document.getElementById('resumeSlot');
  if(!slot) return; // user already navigated away
  if(!room || !room.players[session.myRole]){ clearSavedSession(); return; }
  slot.innerHTML = `<button class="btn btn-secondary" id="resumeBtn" style="margin-bottom:14px;">${tr('resumeSessionBtn',{code:session.roomCode})}</button>`;
  document.getElementById('resumeBtn').onclick = () => {
    myRole = session.myRole; roomCode = session.roomCode;
    currentLang = room.lang || currentLang;
    refreshBrand();
    if(room.status === 'waiting') renderWaitingRoom(room);
    else if(room.status === 'words') renderWordSetup(room);
    else if(room.status === 'playing') renderGame(room);
    else renderEndScreen(room);
  };
}

function genId(){ return 'w' + Math.random().toString(36).slice(2, 10); }
const QUEUE_KEY = 'matchmaking-queue';

async function onRandomMatch(){
  if(!myName){ renderProfileSetup(); return; }
  aiMode = false;
  const data = await loadRaw(QUEUE_KEY);
  const now = Date.now();
  let queue = (data && Array.isArray(data.waiting)) ? data.waiting : [];
  queue = queue.filter(e => now - e.joinedAt < 120000); // drop anyone who's been waiting over 2 minutes

  if(queue.length > 0){
    const opponent = queue.shift();
    await saveRaw(QUEUE_KEY, { waiting: queue });
    const code = genCode();
    const room = emptyRoom(code, opponent.name, opponent.lang || selectedLang, opponent.turnSeconds != null ? opponent.turnSeconds : selectedTurnSeconds);
    room.players.p2 = { name: myName, word: null, guesses: [] };
    room.status = 'words';
    await saveRoom(room);
    await saveRaw('match-' + opponent.id, { roomCode: code, role: 'p1' });
    myRole = 'p2'; roomCode = code; currentLang = room.lang;
    saveSession();
    refreshBrand();
    renderWordSetup(room);
  } else {
    const id = genId();
    queue.push({ id, name: myName, lang: selectedLang, turnSeconds: selectedTurnSeconds, joinedAt: now });
    await saveRaw(QUEUE_KEY, { waiting: queue });
    renderSearching(id);
  }
}

function renderSearching(waitingId){
  stopPolling(); stopTick(); lastSeenKey = null;
  setMusicMood('setup');
  screenEl.innerHTML = `
    <div class="card code-display">
      <div style="margin-top:6px;color:var(--ink-soft);font-size:.9rem;">
        <span class="waiting-pulse"></span>${tr('searchingLabel')}
      </div>
      <button class="btn btn-secondary" id="cancelSearchBtn" style="margin-top:20px;width:auto;">${tr('cancelSearchBtn')}</button>
    </div>
  `;
  document.getElementById('cancelSearchBtn').onclick = async () => {
    stopPolling();
    const data = await loadRaw(QUEUE_KEY);
    let queue = (data && Array.isArray(data.waiting)) ? data.waiting : [];
    queue = queue.filter(e => e.id !== waitingId);
    await saveRaw(QUEUE_KEY, { waiting: queue });
    renderLanding();
  };
  startPolling(async () => {
    const match = await loadRaw('match-' + waitingId);
    if(match && match.roomCode){
      stopPolling();
      saveRaw('match-' + waitingId, {}); // best-effort cleanup
      myRole = match.role; roomCode = match.roomCode;
      saveSession();
      const room = await loadRoom(roomCode);
      if(!room){ renderLanding(); return; }
      currentLang = room.lang || currentLang;
      refreshBrand();
      if(room.status === 'words') renderWordSetup(room);
      else if(room.status === 'playing') renderGame(room);
      else renderWaitingRoom(room);
    }
  });
}

async function onCreateRoom(){
  if(!myName){ renderProfileSetup(); return; }
  aiMode = false;
  const code = genCode();
  const room = emptyRoom(code, myName, selectedLang, selectedTurnSeconds);
  await saveRoom(room);
  myRole = 'p1'; roomCode = code; currentLang = room.lang;
  saveSession();
  refreshBrand();
  renderWaitingRoom(room);
}

async function onJoinRoom(){
  aiMode = false;
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('joinError');
  if(!code){ errEl.textContent = tr('errNeedCode'); errEl.style.display='block'; return; }
  const room = await loadRoom(code);
  if(!room){ errEl.textContent = tr('errNoRoom'); errEl.style.display='block'; return; }
  if(room.players.p2){ errEl.textContent = tr('errRoomFull'); errEl.style.display='block'; return; }
  myRole = 'p2'; roomCode = code; currentLang = room.lang || 'fr';
  saveSession();
  refreshBrand();
  room.players.p2 = { name: myName, word: null, guesses: [] };
  room.status = 'words';
  await saveRoom(room);
  renderWordSetup(room);
}

function renderWaitingRoom(room){
  setMusicMood('setup');
  screenEl.innerHTML = `
    <div class="card code-display">
      <div class="hint">${tr('shareHint')}</div>
      <div class="code">${room.code}</div>
      <div style="display:flex;justify-content:center;margin-top:14px;">
        <button class="btn btn-secondary" id="copyBtn" style="width:auto;">${tr('copyBtn')}</button>
      </div>
      <div style="margin-top:22px;color:var(--ink-soft);font-size:.9rem;">
        <span class="waiting-pulse"></span>${tr('waitingPartner')}
      </div>
    </div>
  `;
  document.getElementById('copyBtn').onclick = async () => {
    try{ await navigator.clipboard.writeText(room.code); }catch(e){}
  };
  startPolling(async () => {
    const fresh = await loadRoom(roomCode);
    if(fresh && fresh.players.p2){
      stopPolling();
      currentLang = fresh.lang || currentLang;
      refreshBrand();
      renderWordSetup(fresh);
    }
  });
}

function renderWordSetup(room){
  stopPolling(); stopTick();
  currentLang = room.lang || currentLang;
  refreshBrand();
  setMusicMood('setup');
  const me = room.players[myRole];
  const already = !!me.word;
  screenEl.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:6px;">${tr('chooseWordTitle')}</h3>
      <p class="hint" style="margin-bottom:16px;">${tr('chooseWordHint')}</p>
      ${already
        ? `<div class="turn-banner mine"><span class="waiting-pulse"></span>${tr('wordSavedWaiting')}</div>`
        : `<input type="text" id="wordInput" placeholder="${tr('wordPlaceholder')}" maxlength="15">
           <div id="wordError" class="error" style="display:none;"></div>
           <button class="btn btn-primary" id="submitWordBtn">${tr('submitWordBtn')}</button>`
      }
    </div>
  `;
  if(!already){
    document.getElementById('submitWordBtn').onclick = async () => {
      const raw = document.getElementById('wordInput').value;
      const word = normWord(raw);
      const errEl = document.getElementById('wordError');
      if(word.length < 3){ errEl.textContent = tr('errWordLen'); errEl.style.display='block'; return; }

      if(aiMode){
        localRoom.players.p1.word = word;
        localRoom.status = 'playing';
        localRoom.turnStartedAt = Date.now();
        renderGame(localRoom);
        return;
      }

      const fresh = await loadRoom(roomCode);
      fresh.players[myRole].word = word;
      if(fresh.players.p1 && fresh.players.p1.word && fresh.players.p2 && fresh.players.p2.word){
        fresh.status = 'playing';
        fresh.turnStartedAt = Date.now();
      }
      await saveRoom(fresh);
      renderWordSetup(fresh);
    };
  }
  if(aiMode) return; // no partner to wait for — nothing to poll
  // Only watch for the game actually starting — never redraw this screen otherwise,
  // so it never wipes out what the person is currently typing.
  startPolling(async () => {
    const fresh = await loadRoom(roomCode);
    if(fresh && fresh.status === 'playing'){
      stopPolling();
      renderGame(fresh);
    }
  });
}

function maskedWord(word, guessLetters){
  return word.split('').map(ch => guessLetters.includes(ch) ? ch : '_');
}

function renderGame(room){
  stopPolling(); stopTick();
  currentLang = room.lang || currentLang;
  refreshBrand();
  if(room.status === 'finished'){ renderEndScreen(room); return; }
  lastSeenKey = fingerprint(room);
  setMusicMood('playing');

  const oppRole = myRole === 'p1' ? 'p2' : 'p1';
  const me = room.players[myRole];
  const opp = room.players[oppRole];
  const myTurn = room.turn === myRole;
  const pause = room.pause || {status:'none'};
  const hasTimer = !!room.turnSeconds;

  const oppMasked = maskedWord(opp.word, me.guesses);
  const myMasked = maskedWord(me.word, opp.guesses);
  const scores = room.scores || {p1:0,p2:0};

  let pauseBlockHtml = '';
  if(aiMode){
    if(pause.status === 'active'){
      pauseBlockHtml = `<div class="pause-box"><p>${tr('pauseActive')}</p>
        <button class="btn btn-primary btn-sm" id="resumeBtn" style="width:auto;">${tr('resumeBtn')}</button></div>`;
    }
  } else if(pause.status === 'pending'){
    if(pause.requestedBy === myRole){
      pauseBlockHtml = `<div class="pause-box"><p>${tr('pausePendingSelf',{name:opp.name})}</p></div>`;
    } else {
      pauseBlockHtml = `<div class="pause-box"><p>${tr('pausePendingOther',{name:opp.name})}</p>
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" id="acceptPauseBtn">${tr('acceptBtn')}</button>
          <button class="btn btn-secondary btn-sm" id="declinePauseBtn">${tr('declineBtn')}</button>
        </div></div>`;
    }
  } else if(pause.status === 'active'){
    pauseBlockHtml = `<div class="pause-box"><p>${tr('pauseActive')}</p>
      <button class="btn btn-primary btn-sm" id="resumeBtn" style="width:auto;">${tr('resumeBtn')}</button></div>`;
  }

  const showTimer = hasTimer && pause.status === 'none';
  const showPauseRequestLink = pause.status === 'none';

  screenEl.innerHTML = `
    <div class="card">
      <div class="players-row">
        <div class="player-chip ${myRole}"><div class="role-label">${tr('youLabel')}</div><div class="name">${me.name}</div></div>
        <div class="link-mid">⟷</div>
        <div class="player-chip ${oppRole}"><div class="role-label">${tr('partnerLabel')}</div><div class="name">${opp.name}</div></div>
      </div>

      <div class="score-row">
        <div class="score-item"><span class="score-name">${me.name}</span><span class="score-num">${scores[myRole]||0}</span></div>
        <div class="score-sep">–</div>
        <div class="score-item"><span class="score-name">${opp.name}</span><span class="score-num">${scores[oppRole]||0}</span></div>
      </div>

      ${pauseBlockHtml}

      ${pause.status === 'none' ? `<div class="turn-banner ${myTurn ? 'mine' : 'theirs'}">${myTurn ? tr('yourTurn') : tr('partnerThinking',{name:opp.name})}</div>` : ''}

      ${showTimer ? `
      <div class="timer-wrap">
        <div class="timer-bar-outer"><div class="timer-bar-inner" id="timerBar" style="width:100%;"></div></div>
        <div class="timer-text"><span id="timerText">${room.turnSeconds}s</span> · ${tr('timeLeftLabel')}</div>
      </div>` : ''}

      ${aiMode
        ? (pause.status === 'none' ? `<div class="pause-link-row"><button class="btn-link" id="aiPauseToggleBtn">${tr('pauseRequestBtn')}</button></div>` : '')
        : (showPauseRequestLink ? `<div class="pause-link-row"><button class="btn-link" id="pauseRequestBtn">${tr('pauseRequestBtn')}</button></div>` : '')
      }

      <div class="section-label">${tr('opponentWordLabel',{name:opp.name})}</div>
      <div class="word-row theirs">${oppMasked.map(l => `<div class="slot">${l==='_'?'':l}</div>`).join('')}</div>

      <div class="keyboard" id="keyboard">
        ${ALPHABET.map(letter => {
          const guessed = me.guesses.includes(letter);
          const hit = guessed && opp.word.includes(letter);
          const miss = guessed && !hit;
          const disabled = !myTurn || guessed || pause.status !== 'none';
          const cls = hit ? 'hit' : (miss ? 'miss' : '');
          return `<button class="key ${cls}" data-letter="${letter}" ${disabled?'disabled':''}>${letter}</button>`;
        }).join('')}
      </div>

      <div class="section-label">${tr('yourWordLabel',{name:opp.name})}</div>
      <div class="word-row mine">${myMasked.map(l => `<div class="slot">${l==='_'?'':l}</div>`).join('')}</div>
    </div>
    <div class="footer-note">${tr('footerNote',{code:room.code, round:(room.round||1)})}</div>
  `;

  if(myTurn && pause.status === 'none'){
    document.querySelectorAll('#keyboard .key').forEach(btn => {
      btn.onclick = () => onGuess(btn.getAttribute('data-letter'));
    });
  }
  const pauseBtn = document.getElementById('pauseRequestBtn');
  if(pauseBtn) pauseBtn.onclick = onRequestPause;
  const acceptBtn = document.getElementById('acceptPauseBtn');
  if(acceptBtn) acceptBtn.onclick = onAcceptPause;
  const declineBtn = document.getElementById('declinePauseBtn');
  if(declineBtn) declineBtn.onclick = onResolvePause;
  const resumeBtn = document.getElementById('resumeBtn');
  if(resumeBtn) resumeBtn.onclick = aiMode ? onToggleAIPause : onResolvePause;
  const aiPauseBtn = document.getElementById('aiPauseToggleBtn');
  if(aiPauseBtn) aiPauseBtn.onclick = onToggleAIPause;

  if(showTimer){
    const turnStartedAt = room.turnStartedAt || Date.now();
    const updateTimer = () => {
      const elapsed = (Date.now() - turnStartedAt) / 1000;
      const remaining = Math.max(0, Math.ceil(room.turnSeconds - elapsed));
      const bar = document.getElementById('timerBar');
      const txt = document.getElementById('timerText');
      if(bar) bar.style.width = Math.max(0,(remaining/room.turnSeconds*100)) + '%';
      if(txt) txt.textContent = remaining + 's';
      return remaining;
    };
    updateTimer(); // set the correct value immediately, no flash back to full
    tickTimer = setInterval(() => {
      const remaining = updateTimer();
      if(remaining <= 0){
        clearInterval(tickTimer); tickTimer = null;
        if(myTurn){
          if(aiMode) autoSkipTurnAI(turnStartedAt); else autoSkipTurn(turnStartedAt);
        }
      }
    }, 1000);
  }

  if(aiMode) return; // purely local — nothing to poll

  startPolling(async () => {
    const fresh = await loadRoom(roomCode);
    if(!fresh) return;
    if(fresh.status === 'finished'){ renderEndScreen(fresh); return; }
    const fp = fingerprint(fresh);
    if(fp !== lastSeenKey){
      renderGame(fresh); // something real changed — redraw
    }
    // otherwise: nothing changed, let the local 1s tick keep counting smoothly
  });
}

function onToggleAIPause(){
  const room = localRoom;
  if(room.pause.status === 'active'){
    const frozenDuration = Date.now() - (room.pause.frozenAt || Date.now());
    room.turnStartedAt = (room.turnStartedAt || Date.now()) + frozenDuration;
    room.pause = { status: 'none', requestedBy: null, frozenAt: null };
  } else {
    room.pause = { status: 'active', requestedBy: 'p1', frozenAt: Date.now() };
  }
  renderGame(room);
}

async function autoSkipTurnAI(expectedTurnStartedAt){
  const room = localRoom;
  if(!room || room.status !== 'playing' || room.turn !== 'p1' || room.turnStartedAt !== expectedTurnStartedAt || room.pause.status !== 'none') return;
  room.turn = 'p2';
  room.turnStartedAt = Date.now();
  renderGame(room);
  setTimeout(() => aiTakeTurn(), 900 + Math.random() * 700);
}

function aiTakeTurn(){
  const room = localRoom;
  if(!room || room.status !== 'playing' || room.turn !== 'p2' || room.pause.status !== 'none') return;
  const me = room.players.p1, opp = room.players.p2;
  const revealed = maskedWord(me.word, opp.guesses);
  const missed = opp.guesses.filter(l => !me.word.includes(l));
  const letter = aiChooseLetter({
    difficulty: aiDifficulty, lang: room.lang, wordLength: me.word.length,
    revealed, guessedLetters: opp.guesses, missedLetters: missed
  });
  if(letter === null){ room.turn = 'p1'; room.turnStartedAt = Date.now(); renderGame(room); return; }
  opp.guesses.push(letter);
  const meUnique = [...new Set(me.word.split(''))];
  const won = meUnique.every(l => opp.guesses.includes(l));
  if(won){
    room.status = 'finished';
    room.winner = 'p2';
    room.scores.p2 = (room.scores.p2 || 0) + 1;
    room.history.push({ round: room.round || 1, winnerName: opp.name, p1Name: me.name, p2Name: opp.name, p1Word: me.word, p2Word: opp.word, at: Date.now() });
    renderGame(room);
    return;
  }
  room.turn = 'p1';
  room.turnStartedAt = Date.now();
  renderGame(room);
}

function onGuessAI(letter){
  const room = localRoom;
  const me = room.players.p1, opp = room.players.p2;
  if(room.turn !== 'p1' || me.guesses.includes(letter) || room.pause.status !== 'none'){ renderGame(room); return; }
  me.guesses.push(letter);
  const oppUnique = [...new Set(opp.word.split(''))];
  const won = oppUnique.every(l => me.guesses.includes(l));
  if(won){
    room.status = 'finished';
    room.winner = 'p1';
    room.scores.p1 = (room.scores.p1 || 0) + 1;
    room.history.push({ round: room.round || 1, winnerName: me.name, p1Name: me.name, p2Name: opp.name, p1Word: me.word, p2Word: opp.word, at: Date.now() });
    renderGame(room);
    return;
  }
  room.turn = 'p2';
  room.turnStartedAt = Date.now();
  renderGame(room);
  setTimeout(() => aiTakeTurn(), 900 + Math.random() * 700);
}

async function onRequestPause(){
  stopPolling(); stopTick();
  const fresh = await loadRoom(roomCode);
  if(!fresh || fresh.status !== 'playing' || fresh.pause.status !== 'none'){ renderGame(fresh); return; }
  fresh.pause = { status: 'pending', requestedBy: myRole, frozenAt: Date.now() };
  await saveRoom(fresh);
  renderGame(fresh);
}
async function onAcceptPause(){
  stopPolling(); stopTick();
  const fresh = await loadRoom(roomCode);
  if(!fresh || fresh.pause.status !== 'pending'){ renderGame(fresh); return; }
  fresh.pause.status = 'active';
  await saveRoom(fresh);
  renderGame(fresh);
}
async function onResolvePause(){
  // used both to decline a pending request and to resume an active pause
  stopPolling(); stopTick();
  const fresh = await loadRoom(roomCode);
  if(!fresh || fresh.pause.status === 'none'){ renderGame(fresh); return; }
  const frozenDuration = Date.now() - (fresh.pause.frozenAt || Date.now());
  fresh.turnStartedAt = (fresh.turnStartedAt || Date.now()) + frozenDuration;
  fresh.pause = { status: 'none', requestedBy: null, frozenAt: null };
  await saveRoom(fresh);
  renderGame(fresh);
}

async function autoSkipTurn(expectedTurnStartedAt){
  stopPolling();
  const fresh = await loadRoom(roomCode);
  if(!fresh || fresh.status !== 'playing') return;
  if(fresh.turn !== myRole || fresh.turnStartedAt !== expectedTurnStartedAt || fresh.pause.status !== 'none'){
    renderGame(fresh); return;
  }
  const oppRole = myRole === 'p1' ? 'p2' : 'p1';
  fresh.turn = oppRole;
  fresh.turnStartedAt = Date.now();
  await saveRoom(fresh);
  renderGame(fresh);
}

async function onGuess(letter){
  if(aiMode){ stopTick(); onGuessAI(letter); return; }
  stopPolling(); stopTick();
  const fresh = await loadRoom(roomCode);
  const oppRole = myRole === 'p1' ? 'p2' : 'p1';
  const me = fresh.players[myRole];
  const opp = fresh.players[oppRole];
  if(fresh.turn !== myRole || me.guesses.includes(letter) || fresh.pause.status !== 'none'){
    renderGame(fresh); return;
  }
  me.guesses.push(letter);
  const oppLettersUnique = [...new Set(opp.word.split(''))];
  const won = oppLettersUnique.every(l => me.guesses.includes(l));
  if(won){
    fresh.status = 'finished';
    fresh.winner = myRole;
    fresh.scores = fresh.scores || {p1:0,p2:0};
    fresh.scores[myRole] = (fresh.scores[myRole]||0) + 1;
    fresh.history = fresh.history || [];
    fresh.history.push({
      round: fresh.round || 1,
      winnerName: me.name,
      p1Name: fresh.players.p1.name,
      p2Name: fresh.players.p2.name,
      p1Word: fresh.players.p1.word,
      p2Word: fresh.players.p2.word,
      at: Date.now()
    });
  } else {
    fresh.turn = oppRole;
    fresh.turnStartedAt = Date.now();
  }
  await saveRoom(fresh);
  renderGame(fresh);
}

function renderEndScreen(room){
  stopPolling(); stopTick(); lastSeenKey = null;
  currentLang = room.lang || currentLang;
  refreshBrand();
  const iWon = room.winner === myRole;
  const p1 = room.players.p1, p2 = room.players.p2;
  const scores = room.scores || {p1:0,p2:0};
  const history = room.history || [];
  setMusicMood(iWon ? 'victory' : 'defeat');
  const historyHtml = history.length ? `
      <div class="section-label" style="margin-top:20px;">${tr('historyLabel')}</div>
      <div class="history-list">
        ${history.slice().reverse().map(h => `
          <div class="history-item">
            <span class="history-round">${tr('historyRound',{round:h.round})}</span>
            <span class="history-winner">${tr('historyWinner',{name:h.winnerName})}</span>
          </div>
        `).join('')}
      </div>` : '';
  screenEl.innerHTML = `
    <div class="card winner-screen">
      <div class="trophy">🏆</div>
      <h2>${iWon ? tr('youWon') : tr('theyWon',{name:room.players[room.winner].name})}</h2>
      <p class="hint">${iWon ? tr('youWonSub') : tr('theyWonSub')}</p>
      <div class="reveal-words">
        <div><b>${p1.name}</b> : ${p1.word}</div>
        <div><b>${p2.name}</b> : ${p2.word}</div>
      </div>
      <div class="section-label" style="margin-top:20px;">${tr('scoreLabel')}</div>
      <div class="score-row">
        <div class="score-item"><span class="score-name">${p1.name}</span><span class="score-num">${scores.p1||0}</span></div>
        <div class="score-sep">–</div>
        <div class="score-item"><span class="score-name">${p2.name}</span><span class="score-num">${scores.p2||0}</span></div>
      </div>
      ${historyHtml}
      <button class="btn btn-primary" id="replayBtn" style="margin-top:16px;">${tr('replayBtn')}</button>
      <button class="btn-link" id="resetScoreBtn">${tr('resetScoreBtn')}</button>
    </div>
    <div class="footer-note">${tr('footerNote',{code:room.code, round:(room.round||1)})}</div>
  `;
  if(iWon) spawnConfetti();

  document.getElementById('replayBtn').onclick = async () => {
    if(aiMode){
      const room = localRoom;
      room.players.p1.word = null; room.players.p1.guesses = [];
      room.players.p2.word = null; room.players.p2.guesses = []; room.players.p2.word = pickAIWord(room.lang);
      room.status = 'words';
      room.round = (room.round||1) + 1;
      room.turn = 'p1';
      room.turnStartedAt = null;
      room.winner = null;
      room.pause = { status: 'none', requestedBy: null, frozenAt: null };
      renderWordSetup(room);
      return;
    }
    const fresh = await loadRoom(roomCode);
    fresh.players.p1.word = null; fresh.players.p1.guesses = [];
    fresh.players.p2.word = null; fresh.players.p2.guesses = [];
    fresh.status = 'words';
    fresh.round = (fresh.round||1) + 1;
    fresh.turn = fresh.round % 2 === 0 ? 'p2' : 'p1';
    fresh.turnStartedAt = null;
    fresh.winner = null;
    fresh.pause = { status: 'none', requestedBy: null, frozenAt: null };
    await saveRoom(fresh);
    renderWordSetup(fresh);
  };
  document.getElementById('resetScoreBtn').onclick = async () => {
    if(aiMode){
      localRoom.scores = {p1:0,p2:0};
      localRoom.history = [];
      renderEndScreen(localRoom);
      return;
    }
    const fresh = await loadRoom(roomCode);
    fresh.scores = {p1:0,p2:0};
    fresh.history = [];
    await saveRoom(fresh);
    renderEndScreen(fresh);
  };

  if(aiMode) return; // local game — nothing to poll

  startPolling(async () => {
    const fresh = await loadRoom(roomCode);
    if(fresh && fresh.status !== 'finished'){
      stopPolling();
      renderWordSetup(fresh);
    }
  });
}

/* ---------- Ambient background music (generated, no external file) ---------- */
let musicEnabled = true;
let audioCtx = null, masterGain = null, moodTimers = [], currentMood = 'setup';

const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C D E G A C — major pentatonic
const SETUP_PATTERN   = [0,2,4,2, 3,2,1,0, 2,4,5,4, 3,2,0,null];
const PLAYING_PATTERN = [0,null,2,4, 5,4,2,null, 0,2,4,2, 3,5,4,null];
const VICTORY_SEQUENCE = [
  {freq:261.63, at:0.00, decay:0.5, peak:0.09},
  {freq:329.63, at:0.13, decay:0.5, peak:0.09},
  {freq:392.00, at:0.26, decay:0.5, peak:0.09},
  {freq:523.25, at:0.39, decay:0.5, peak:0.10},
  {freq:659.25, at:0.52, decay:0.5, peak:0.10},
  {freq:392.00, at:0.68, decay:1.3, peak:0.12},
  {freq:523.25, at:0.68, decay:1.3, peak:0.12},
  {freq:659.25, at:0.68, decay:1.3, peak:0.12}
];
const DEFEAT_SEQUENCE = [
  {freq:293.66, at:0.00, decay:0.6, peak:0.07},
  {freq:261.63, at:0.35, decay:0.6, peak:0.065},
  {freq:220.00, at:0.70, decay:0.7, peak:0.06},
  {freq:196.00, at:1.05, decay:1.3, peak:0.055}
];

function ensureAudioStarted(){
  if(!musicEnabled) return;
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  if(!masterGain && currentMood) applyMood(currentMood);
}

function ensureMasterGain(){
  if(!masterGain){
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
  }
  return masterGain;
}

function playNote(freq, time, opts){
  opts = opts || {};
  const wave = opts.wave || 'sine';
  const peak = opts.peak != null ? opts.peak : 0.09;
  const decay = opts.decay != null ? opts.decay : 0.9;
  const shimmer = opts.shimmer !== false;
  const g = ensureMasterGain();

  const osc = audioCtx.createOscillator();
  osc.type = wave;
  osc.frequency.value = freq;
  const gn = audioCtx.createGain();
  gn.gain.setValueAtTime(0.0001, time);
  gn.gain.exponentialRampToValueAtTime(peak, time + 0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001, time + decay);
  osc.connect(gn); gn.connect(g);
  osc.start(time); osc.stop(time + decay + 0.05);

  if(shimmer){
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    const g2 = audioCtx.createGain();
    g2.gain.setValueAtTime(0.0001, time);
    g2.gain.exponentialRampToValueAtTime(peak * 0.28, time + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001, time + decay * 0.8);
    osc2.connect(g2); g2.connect(g);
    osc2.start(time); osc2.stop(time + decay * 0.8 + 0.05);
  }
}

function startLoop(pattern, stepMs, opts){
  ensureMasterGain();
  let stepIndex = 0;
  const step = () => {
    const idx = pattern[stepIndex % pattern.length];
    if(idx !== null) playNote(SCALE[idx], audioCtx.currentTime + 0.02, opts);
    stepIndex++;
  };
  step();
  moodTimers.push(setInterval(step, stepMs));
}

function playOneShot(sequence, opts){
  ensureMasterGain();
  const now = audioCtx.currentTime;
  sequence.forEach(n => {
    playNote(n.freq, now + n.at, Object.assign({}, opts, n));
  });
}

function stopCurrentMood(){
  moodTimers.forEach(id => clearInterval(id));
  moodTimers = [];
  const oldGain = masterGain;
  if(oldGain && audioCtx){
    try{
      oldGain.gain.cancelScheduledValues(audioCtx.currentTime);
      oldGain.gain.setValueAtTime(oldGain.gain.value, audioCtx.currentTime);
      oldGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
    }catch(e){}
  }
  setTimeout(() => { if(oldGain) oldGain.disconnect(); }, 500);
  masterGain = null;
}

function applyMood(mood){
  if(mood === 'setup') startLoop(SETUP_PATTERN, 300, {wave:'sine', peak:0.09, decay:0.9});
  else if(mood === 'playing') startLoop(PLAYING_PATTERN, 260, {wave:'sine', peak:0.08, decay:0.7});
  else if(mood === 'victory') playOneShot(VICTORY_SEQUENCE, {wave:'triangle', shimmer:true});
  else if(mood === 'defeat') playOneShot(DEFEAT_SEQUENCE, {wave:'sine', shimmer:false});
}

function setMusicMood(mood){
  const isLoop = mood === 'setup' || mood === 'playing';
  if(isLoop && mood === currentMood && masterGain){ currentMood = mood; return; }
  currentMood = mood;
  if(!musicEnabled) return;
  stopCurrentMood();
  if(audioCtx) applyMood(mood);
}

document.getElementById('musicToggle').onclick = () => {
  musicEnabled = !musicEnabled;
  document.getElementById('musicToggle').textContent = musicEnabled ? '🔊' : '🔇';
  if(musicEnabled){ ensureAudioStarted(); } else { stopCurrentMood(); }
};
document.addEventListener('click', function firstGestureUnlock(){
  ensureAudioStarted();
  document.removeEventListener('click', firstGestureUnlock);
}, { once: true });

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

refreshBrand();
renderLanding();
</script>
